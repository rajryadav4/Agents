# 24/7 on any always-on box (Oracle Cloud free VM, a $4 VPS, a Raspberry Pi, a home server).
#   cp ../dealhawk/config.example.yaml data/dealhawk.yaml   # then edit it
#   cp .env.example .env                                     # then fill in secrets
#   docker compose up -d && docker compose logs -f
services:
  dealhawk:
    build: ..
    restart: unless-stopped
    env_file: .env
    environment:
      DEALHAWK_WEB_HOST: 0.0.0.0          # reachable from outside the container…
      # …so DEALHAWK_WEB_PASSWORD must be set in .env (the config refuses to start without it)
    volumes:
      - ./data:/data          # config + dealhawk.db (price history + learned model) live here
    ports:
      - "8686:8686"           # live dashboard + phone feedback routes
