[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "warden-agents"
version = "1.0.0"
description = "WARDEN: a control plane and firewall for AI agents (identity, policy, information-flow control, red-teaming, trust scores)."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
  "fastapi>=0.110",
  "uvicorn>=0.27",
  "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-xdist>=3", "hypothesis>=6", "httpx>=0.27"]
claude = ["anthropic>=0.40"]

[project.scripts]
warden = "warden.cli:main"

[tool.setuptools.packages.find]
include = ["warden*"]

[tool.setuptools.package-data]
warden = ["server/static/**/*", "data/*", "demo/*.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = ["e2e: browser end-to-end tests (needs node + playwright)", "slow: slower tests"]
